<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10M Hilbert ring</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      color: #e8eef7;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #scene {
      position: absolute;
      inset: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #scene canvas:active { cursor: grabbing; }

    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05070b;
      letter-spacing: 0.02em;
      z-index: 2;
    }

    #status[hidden] { display: none; }
    #status.error { color: #ff8f8f; }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(8, 12, 20, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      z-index: 1;
      pointer-events: none;
      max-width: 320px;
    }

    #hud[hidden] { display: none; }

    #hud .title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    #hud b { color: #9ad1ff; font-weight: 600; }

    #hud .hint {
      margin-top: 6px;
      color: rgba(232, 238, 247, 0.55);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="scene" tabindex="0"></div>
  <div id="status">Loading…</div>
  <div id="hud" hidden></div>
  <script src="bundle.js"></script>
</body>
</html>
