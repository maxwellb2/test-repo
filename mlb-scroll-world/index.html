<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Cathedrals — a continuous flight through six MLB ballparks</title>
<meta name="description" content="Scroll-scrubbed camera flight through six Major League ballparks — approach and arrival at each park, closed loop.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f4f7fa'/%3E%3Cpath d='M7 6q6 10 0 20M25 6q-6 10 0 20' stroke='%23BD3039' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
  :root, .sw-root {
    --sw-bg: #0a0e14;
    --sw-ink: #f4f7fa;
    --sw-ink-soft: #8c9bab;
    --sw-accent: #BD3039;
    --sw-font-display: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }

  .sw-root .sw-topcta,
  .sw-root .sw-btn--primary { color: #0a0e14; background: var(--sw-ink); }
  .sw-root .sw-btn--ghost { color: var(--sw-ink); border-color: color-mix(in srgb, var(--sw-ink) 32%, transparent); }
  .sw-root .sw-nav { background: color-mix(in srgb, #fff 8%, transparent); }
  .sw-root .sw-copy__tags li {
    color: color-mix(in srgb, var(--sw-accent) 62%, #fff);
    background: color-mix(in srgb, var(--sw-accent) 16%, transparent);
    border-color: color-mix(in srgb, var(--sw-accent) 40%, transparent);
  }
  .sw-root .sw-route__label { color: var(--sw-ink); background: color-mix(in srgb, #0a0e14 78%, transparent); }

  .sw-root .sw-copylayer::before {
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--sw-bg) 97%, transparent) 0%,
      color-mix(in srgb, var(--sw-bg) 88%, transparent) 36%,
      color-mix(in srgb, var(--sw-bg) 46%, transparent) 68%,
      transparent 100%);
  }

  .credits {
    position: fixed; z-index: 45; left: clamp(18px, 5vw, 64px); bottom: 14px;
    font: 400 0.68rem/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: color-mix(in srgb, #8c9bab 70%, transparent);
  }
  .credits a { color: inherit; }
  @media (max-width: 860px) { .credits { display: none; } }
</style>
</head>
<body>
  <div id="world"></div>

  <p class="credits">
    Ballpark photography from
    <a href="https://commons.wikimedia.org/">Wikimedia Commons</a>
    under CC&nbsp;BY / CC&nbsp;BY-SA / public domain &mdash; see README for per-image credit.
  </p>

  <script src="scrub-engine.js"></script>
  <script>
    // Clip root — swap to assets/vid-plane to A/B the homography renderer.
    const VID = 'assets/vid';

    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'The Cathedrals', href: '#top' },
      cta: { label: 'Back home', href: '#home' },
      hint: 'scroll to fly in',

      // Twelve beats (approach + arrival × 6) + wrap home ≈ 28 screens.
      diveScroll: 1.35,
      connScroll: 0.75,

      sections: [
        {
          id: 'fenway-approach', label: 'Fenway', accent: '#BD3039',
          still: 'assets/fenway-approach.jpg',
          clip: `${VID}/dive-fenway-approach.mp4`,
          clipMobile: `${VID}/dive-fenway-approach-m.mp4`,
          scroll: 1.5, linger: 0.28,
          eyebrow: 'Boston · 1912',
          title: 'Where the wall is a character.',
          body: 'The oldest park still in the league, wedged into the Fens at angles ' +
                'no architect would choose. Left field ran out of room at 310 feet, ' +
                'so they built up instead of out.',
          tags: ['Opened 1912', 'Green Monster — 37 ft 2 in'],
        },
        {
          id: 'fenway-arrival', label: 'Fenway · close', accent: '#BD3039',
          still: 'assets/fenway-arrival.jpg',
          clip: `${VID}/dive-fenway-arrival.mp4`,
          clipMobile: `${VID}/dive-fenway-arrival-m.mp4`,
          scroll: 1.35, linger: 0.38,
          eyebrow: 'The Monster',
          title: 'Thirty-seven feet of green.',
          body: 'Push in past the seats and the wall stops being a postcard and starts ' +
                'being a surface — hand-operated scoreboard, ladder, and all.',
          tags: ['37,755 seats'],
        },
        {
          id: 'wrigley-approach', label: 'Wrigley', accent: '#0E3386',
          still: 'assets/wrigley-approach.jpg',
          clip: `${VID}/dive-wrigley-approach.mp4`,
          clipMobile: `${VID}/dive-wrigley-approach-m.mp4`,
          scroll: 1.45, linger: 0.28,
          eyebrow: 'Chicago · 1914',
          title: 'Ivy on brick, scoreboard by hand.',
          body: 'Two years younger than Fenway and just as stubborn. The outfield ' +
                'wall grows its own padding, and the center-field scoreboard has ' +
                'been turned by hand from the inside since 1937.',
          tags: ['Opened 1914', 'Ivy planted 1937'],
        },
        {
          id: 'wrigley-arrival', label: 'Wrigley · close', accent: '#0E3386',
          still: 'assets/wrigley-arrival.jpg',
          clip: `${VID}/dive-wrigley-arrival.mp4`,
          clipMobile: `${VID}/dive-wrigley-arrival-m.mp4`,
          scroll: 1.35, linger: 0.38,
          eyebrow: 'Waveland & Sheffield',
          title: 'A neighborhood with a diamond.',
          body: 'Rooftops sell tickets across the street. The park never sprawled; ' +
                'the city pressed in instead.',
          tags: ['Lights arrived 1988'],
        },
        {
          id: 'oracle-approach', label: 'Oracle Park', accent: '#FD5A1E',
          still: 'assets/oracle-approach.jpg',
          clip: `${VID}/dive-oracle-approach.mp4`,
          clipMobile: `${VID}/dive-oracle-approach-m.mp4`,
          scroll: 1.4, linger: 0.28,
          eyebrow: 'San Francisco · 2000',
          title: 'Right field is the Bay.',
          body: 'A 24-foot wall in right — Willie Mays’ number — and past it, open ' +
                'water. Kayakers idle in McCovey Cove waiting for the ball that ' +
                'clears everything.',
          tags: ['Opened 2000', 'McCovey Cove'],
        },
        {
          id: 'oracle-arrival', label: 'Oracle · close', accent: '#FD5A1E',
          still: 'assets/oracle-arrival.jpg',
          clip: `${VID}/dive-oracle-arrival.mp4`,
          clipMobile: `${VID}/dive-oracle-arrival-m.mp4`,
          scroll: 1.35, linger: 0.38,
          eyebrow: 'McCovey Cove',
          title: 'Splash hits only.',
          body: 'The camera settles over the cove — where the park stops being a ' +
                'building and becomes a shoreline.',
          tags: ['24 ft right-field wall'],
        },
        {
          id: 'pnc-approach', label: 'PNC Park', accent: '#FDB827',
          still: 'assets/pnc-approach.jpg',
          clip: `${VID}/dive-pnc-approach.mp4`,
          clipMobile: `${VID}/dive-pnc-approach-m.mp4`,
          scroll: 1.45, linger: 0.28,
          eyebrow: 'Pittsburgh · 2001',
          title: 'Two decks, on purpose.',
          body: 'Built deliberately small so nothing sits between you and the ' +
                'Allegheny, the yellow spans of the Clemente Bridge, and the ' +
                'skyline behind them.',
          tags: ['Opened 2001', 'Clemente Bridge'],
        },
        {
          id: 'pnc-arrival', label: 'PNC · close', accent: '#FDB827',
          still: 'assets/pnc-arrival.jpg',
          clip: `${VID}/dive-pnc-arrival.mp4`,
          clipMobile: `${VID}/dive-pnc-arrival-m.mp4`,
          scroll: 1.35, linger: 0.42,
          eyebrow: 'The best view in the sport',
          title: 'Bridge, river, skyline.',
          body: 'Parallax finally earns its keep here — the bridge slides past the ' +
                'stadium as the camera trucks in.',
          tags: ['Only two decks'],
        },
        {
          id: 'dodger-approach', label: 'Dodger Stadium', accent: '#005A9C',
          still: 'assets/dodger-approach.jpg',
          clip: `${VID}/dive-dodger-approach.mp4`,
          clipMobile: `${VID}/dive-dodger-approach-m.mp4`,
          scroll: 1.4, linger: 0.28,
          eyebrow: 'Los Angeles · 1962',
          title: 'Carved into a hillside.',
          body: 'Terraced into Chavez Ravine so every seating level enters at its ' +
                'own grade — park on your tier, walk straight in. Downtown waits ' +
                'on the horizon.',
          tags: ['Opened 1962', '56,000 seats'],
        },
        {
          id: 'dodger-arrival', label: 'Dodger · close', accent: '#005A9C',
          still: 'assets/dodger-arrival.jpg',
          clip: `${VID}/dive-dodger-arrival.mp4`,
          clipMobile: `${VID}/dive-dodger-arrival-m.mp4`,
          scroll: 1.35, linger: 0.38,
          eyebrow: 'Chavez Ravine',
          title: 'Stadium first, DTLA behind.',
          body: 'The bowl holds while the skyline drifts — depth that a flat crop ' +
                'could never invent.',
          tags: ['Largest by capacity'],
        },
        {
          id: 'camden-approach', label: 'Camden Yards', accent: '#DF4601',
          still: 'assets/camden-approach.jpg',
          clip: `${VID}/dive-camden-approach.mp4`,
          clipMobile: `${VID}/dive-camden-approach-m.mp4`,
          scroll: 1.5, linger: 0.28,
          eyebrow: 'And it all traces back to',
          title: 'The park that reset the century.',
          body: 'Camden Yards put brick, asymmetry and a downtown back into the ' +
                'ballpark, and nearly everything built since has copied it.',
          tags: ['Opened 1992'],
        },
        {
          id: 'camden-arrival', label: 'Camden · close', accent: '#DF4601',
          still: 'assets/camden-arrival.jpg',
          clip: `${VID}/dive-camden-arrival.mp4`,
          clipMobile: `${VID}/dive-camden-arrival-m.mp4`,
          scroll: 1.4, linger: 0.42,
          eyebrow: 'B&O Warehouse',
          title: 'One thousand sixteen feet of brick.',
          body: 'The warehouse behind right field runs the length of the block — ' +
                'the longest building on the East Coast, and the reason the park ' +
                'feels like a city.',
          tags: ['B&O Warehouse — 1,016 ft'],
        },
        {
          id: 'home', label: 'Home', accent: '#BD3039',
          still: 'assets/home.jpg',
          clip: `${VID}/dive-home.mp4`,
          clipMobile: `${VID}/dive-home-m.mp4`,
          scroll: 1.15, linger: 0.55,
          eyebrow: 'Back where we started',
          title: 'One continuous flight. No cuts.',
          body: 'Fifteen hundred frames, twelve beats, six ballparks — and the last ' +
                'frame is the first. Scroll up and the camera runs it in reverse.',
          tags: ['Closed loop', 'Frame-locked seams', 'Depth parallax'],
          cta: {
            primary:   { label: 'Fly it again', href: '#top' },
            secondary: { label: 'MLB ballparks', href: 'https://www.mlb.com/ballparks' },
          },
        },
      ],

      connectors: Array.from({length: 12}, (_, i) => `${VID}/conn-${i}.mp4`),
      connectorsMobile: Array.from({length: 12}, (_, i) => `${VID}/conn-${i}-m.mp4`),
    });
  </script>
</body>
</html>
